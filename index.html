<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0a0806">
<title>着迷黑金贵族体系 · 九阶权益对照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0806; --bg-2:#120d08;
  --gold:#d4af37; --gold-bright:#f7e08a; --gold-soft:#c9a227; --gold-deep:#8a6d1f;
  --gold-line:rgba(212,175,55,.22); --gold-line-strong:rgba(212,175,55,.5);
  --cream:#f4ecd8; --muted:#b9a98a; --dim:#5c5040;
  --serif:"Noto Serif SC",serif; --sans:"Noto Sans SC",system-ui,sans-serif; --latin:"Cinzel","Cormorant Garamond",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); color:var(--cream); background:var(--bg); line-height:1.4;
  height:100dvh; overflow:hidden; display:flex; flex-direction:column;
  background-image:
    radial-gradient(1100px 600px at 80% -5%, rgba(212,175,55,.10), transparent 60%),
    radial-gradient(900px 500px at 5% 10%, rgba(138,109,31,.10), transparent 55%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.4;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.83 0 0 0 0 0.69 0 0 0 0 0.22 0 0 0 0.06 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
}
main,header,footer{position:relative;z-index:2}

/* ===== 极简标题 ===== */
header{padding:8px 16px 4px;text-align:center;flex:0 0 auto}
header h1{
  font-family:var(--serif);font-weight:900;font-size:clamp(19px,4.6vw,28px);letter-spacing:.08em;
  background:linear-gradient(180deg,#fff7d6,var(--gold) 60%,var(--gold-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header .sub{font-family:var(--latin);letter-spacing:.3em;color:var(--gold-soft);font-size:clamp(8.5px,1.3vw,10.5px);margin-top:3px}

/* ===== 横向对照核心 ===== */
.cmp-wrap{
  flex:1 1 auto; min-height:0;
  overflow-x:auto; overflow-y:auto;
  margin:0;padding:0 6px;
  -webkit-overflow-scrolling:touch;
}
.cmp-wrap::-webkit-scrollbar{height:8px;width:8px}
.cmp-wrap::-webkit-scrollbar-track{background:rgba(0,0,0,.4)}
.cmp-wrap::-webkit-scrollbar-thumb{background:linear-gradient(90deg,var(--gold-deep),var(--gold));border-radius:8px}

table{border-collapse:separate;border-spacing:0;min-width:1040px;width:100%}
thead th{position:sticky;top:0;z-index:6;background:linear-gradient(180deg,#1c1409,#0e0a06);border-bottom:1px solid var(--gold-line-strong)}
thead th.tier{padding:4px 3px 3px;text-align:center;min-width:104px}
thead th.tier .rom{
  font-family:var(--serif);font-weight:900;font-size:clamp(15px,2.6vw,22px);line-height:1;
  background:linear-gradient(180deg,#fff7d6,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
}
thead th.tier .g{font-family:var(--latin);font-size:7.5px;letter-spacing:.2em;color:var(--muted);margin-top:3px}
thead th.tier .w{font-family:var(--serif);font-size:9.5px;color:var(--gold-bright);margin-top:2px;font-weight:600}
thead th.tier .w b{color:var(--cream);font-weight:700}
/* 等级递进高亮 */
thead th.tier.lv-5,.tier.lv-6,.tier.lv-7{box-shadow:inset 0 0 0 1px var(--gold-line-strong)}
thead th.tier.lv-8,.tier.lv-9{box-shadow:inset 0 0 0 1.5px var(--gold),0 0 22px rgba(212,175,55,.12)}
thead th.tier.lv-9 .rom{position:relative}
thead th.tier.lv-9 .rom::after{content:"至尊";position:absolute;top:-8px;right:-6px;font-family:var(--serif);font-size:9px;letter-spacing:.1em;color:#1a130a;background:linear-gradient(180deg,var(--gold-bright),var(--gold));padding:1px 6px;border-radius:10px;font-weight:700}

/* 左侧固定列 */
th.label,td.label{position:sticky;left:0;z-index:4;background:#100b06;padding:3px 9px;text-align:left;border-right:1px solid var(--gold-line-strong);white-space:nowrap}
thead th.label{z-index:7;background:#1c1409;font-size:11px}

/* 类别行 */
tbody tr.cat td{
  background:linear-gradient(90deg,rgba(40,28,10,.95),rgba(18,12,6,.92));
  padding:3px 10px;font-family:var(--serif);font-weight:700;color:var(--gold-bright);font-size:11px;letter-spacing:.1em;line-height:1.2;
  border-top:1px solid var(--gold-line-strong);border-bottom:1px solid var(--gold-line-strong);
}
tbody tr.cat td .ce{font-family:var(--latin);font-size:7.5px;color:var(--muted);letter-spacing:.25em;margin-left:6px;font-weight:400}

/* 数据行 */
tbody tr.row td{padding:1px 6px;text-align:center;font-size:10px;line-height:1.15;border-bottom:1px solid rgba(212,175,55,.08);overflow:hidden}
tbody tr.row td.label{color:var(--cream);font-size:10px}
tbody tr.row:hover td{background:rgba(212,175,55,.05)}
tbody tr.row td.label{background:#100b06}
tbody tr.row:hover td.label{background:#18110a}

td .yes{color:var(--gold-bright);font-weight:700;font-family:var(--latin)}
td .yes::before{content:"✓"}
td .no{color:var(--dim)}
td .no::before{content:"—"}
td .num{font-family:var(--serif);font-weight:600;color:var(--gold-bright)}
td .txt{color:var(--cream)}

/* 等级列递进背景（右侧列越高级越亮） */
td.col-5,td.col-6,td.col-7{background:rgba(212,175,55,.025)}
td.col-8,td.col-9{background:rgba(212,175,55,.05)}

/* 滑动提示 */
.hint{text-align:center;font-family:var(--latin);font-size:10px;letter-spacing:.25em;color:var(--dim);margin:4px 0 8px;flex:0 0 auto}
main{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}

/* ===== 底部二维码 ===== */
.qr-foot{text-align:center;padding:30px 16px 44px;border-top:1px solid var(--gold-line)}
.qr-foot .qr-box{
  display:inline-block;padding:14px;border:1px solid var(--gold-line-strong);border-radius:12px;
  background:rgba(248,240,216,.05);
}
.qr-foot .qr-box img{display:block;width:130px;height:130px;border-radius:4px}
.qr-foot p{margin-top:12px;color:var(--gold-bright);font-family:var(--serif);font-weight:600;font-size:14px}
.qr-foot .url{font-family:var(--latin);color:var(--gold-soft);font-size:12px;margin-top:4px;letter-spacing:.1em}
.qr-foot .copy{color:var(--dim);font-size:11px;margin-top:16px;letter-spacing:.06em}

@media(max-width:560px){
  thead th.tier{min-width:104px;padding:10px 4px}
  th.label,td.label{padding:8px 10px;font-size:12px}
  tbody tr.row td{padding:5px 6px;font-size:11.5px}
}
</style>
</head>
<body>
<header>
  <h1>着迷黑金贵族体系</h1>
  <div class="sub">NINE TIERS · 横向权益对照</div>
</header>

<main>
  <div class="cmp-wrap">
    <table id="cmpTable"></table>
  </div>
  <div class="hint">← 滑动黑金 I→IX · 左列权益项固定 · 逐档对照 →</div>
</main>

<script>
const TIERS=[
  {id:'I',wealth:3000,group:'初阶'},{id:'II',wealth:4500,group:'初阶'},
  {id:'III',wealth:6000,group:'中阶'},{id:'IV',wealth:8000,group:'中阶'},
  {id:'V',wealth:10000,group:'高级'},{id:'VI',wealth:12000,group:'高级'},
  {id:'VII',wealth:15000,group:'高级'},{id:'VIII',wealth:18000,group:'至尊'},
  {id:'IX',wealth:21000,group:'至尊'},
];
const BENEFITS=[
  {cat:'每月福利',catEn:'MONTHLY',item:'每月灵石',vals:['4000','7000','10000','14000','17000','20000','23000','30000','36000'],kind:'num'},
  {cat:'每月福利',catEn:'MONTHLY',item:'每月粉钻',vals:['20','30','40','50','60','70','80','100','150'],kind:'num'},
  {cat:'每月福利',catEn:'MONTHLY',item:'好友位卡',vals:['1个','2个','3个','4个','5个','6个','8个','无限制','无限制'],kind:'txt'},
  {cat:'每月福利',catEn:'MONTHLY',item:'平日主群冠名1日卡',vals:['1张','2张','3张','3张','4张','5张','5张','7张','7张'],kind:'txt'},
  {cat:'每月福利',catEn:'MONTHLY',item:'平日BOT冠名1日卡',vals:['1张','2张','3张','3张','4张','5张','5张','7张','7张'],kind:'txt'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'永久无流放标识',vals:[null,'✔','✔','✔','✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'无限免费删黑、恢复数据',vals:[null,null,'✔','✔','✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'主群发言无敏感词限制',vals:[null,null,null,'✔','✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'头衔',vals:['六字头衔','六字头衔','六字头衔','六字头衔','至尊一字头衔','至尊一字头衔','至尊一字头衔','至尊一字头衔','至尊一字头衔'],kind:'txt'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'自由马甲',vals:['中级自由马甲','中级自由马甲','高级自由马甲','高级自由马甲','至尊一字马甲','至尊一字马甲','至尊一字马甲','至尊一字马甲','至尊一字马甲'],kind:'txt'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'尊享个人卡1张（管理优选）',vals:['✔','—','—','—','—','—','—','—','—'],kind:'bool'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'个人认证卡1张（自选卡名）',vals:[null,null,'✔','—','—','—','—','—','—'],kind:'bool'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'专属C卡',vals:[null,null,null,'✔','—','—','—','—','—'],kind:'bool'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'双人认证卡1张（自选卡名）',vals:[null,null,null,null,'✔','—','—','—','—'],kind:'bool'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'多人认证卡1张（自选卡名）',vals:[null,null,null,null,'4人','4人','6人','6人','8人'],kind:'txt'},
  {cat:'尊享权益',catEn:'PREMIUM',item:'BOT权限',vals:[null,'2级','2级','2级','5级','5级','5级','5级','5级'],kind:'txt'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'黑金卡等级',vals:['初阶（I级）','初阶（II级）','中阶（III级）','中阶（IV级）','高级（V级）','高级（VI级）','高级（VII级）','至尊（VIII级）','至尊（IX级）'],kind:'txt'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'生日祝福',vals:['1档','2档','3档','4档','5档','5档+生日电台','5档+生日电台','6档+生日电台','6档+生日电台'],kind:'txt'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'推荐赞助返现',vals:['10%','10%','10%','10%','15%','15%','15%','20%','20%'],kind:'num'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'消费及充值折扣',vals:[null,'95折','95折','9折','9折','85折','85折','8折','8折'],kind:'txt'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'入驻着迷名人堂',vals:[null,null,'✔','✔','✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'福利活动无视限制条件',vals:[null,null,'✔','✔','✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'专属个人俱乐部',vals:[null,null,null,null,'✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'与CP共享尊享权益',vals:[null,null,null,null,'✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'挚友共享尊享权益',vals:[null,null,null,null,null,'1名','1名','2名','3名'],kind:'txt'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'每年包场15首歌曲电台',vals:[null,null,null,null,null,'1次','1次','1次','1次'],kind:'txt'},
  {cat:'黑金专享权益',catEn:'EXCLUSIVE',item:'每年包场30首歌曲电台',vals:[null,null,null,null,null,null,null,null,'1次'],kind:'txt'},
  {cat:'拍卖特权',catEn:'AUCTION',item:'拍卖委托交易手续费',vals:[null,null,'9折','9折','8折','8折','7折','6折','5折'],kind:'txt'},
  {cat:'拍卖特权',catEn:'AUCTION',item:'拍卖清单优先查阅',vals:[null,null,'✔','✔','✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'拍卖特权',catEn:'AUCTION',item:'竞拍匿名出价',vals:[null,null,'✔','✔','✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'拍卖特权',catEn:'AUCTION',item:'流拍拍品议价内购',vals:[null,null,null,null,'✔','✔','✔','✔','✔'],kind:'bool'},
  {cat:'拍卖特权',catEn:'AUCTION',item:'竞拍保密出价',vals:[null,null,null,null,null,null,'✔','✔','✔'],kind:'bool'},
];
const CAT_ORDER=['每月福利','尊享权益','黑金专享权益','拍卖特权'];

const fmt=n=>n.toLocaleString('en-US');
const tbl=document.getElementById('cmpTable');

// 表头
let html='<thead><tr><th class="label">权益项</th>';
TIERS.forEach((t,i)=>{
  html+=`<th class="tier lv-${i+1}"><div class="rom">${t.id}</div><div class="g">${t.group}</div><div class="w">财富 <b>${fmt(t.wealth)}</b></div></th>`;
});
html+='</tr></thead><tbody>';

let prevCat=null;
BENEFITS.forEach(b=>{
  if(b.cat!==prevCat){
    html+=`<tr class="cat"><td colspan="${TIERS.length+1}">${b.cat}<span class="ce">${b.catEn}</span></td></tr>`;
    prevCat=b.cat;
  }
  html+=`<tr class="row"><td class="label">${b.item}</td>`;
  b.vals.forEach((v,ci)=>{
    let cell;
    if(v===null||v==='—') cell=`<span class="no"></span>`;
    else if(v==='✔') cell=`<span class="yes"></span>`;
    else if(b.kind==='num') cell=`<span class="num">${v}</span>`;
    else cell=`<span class="txt">${v}</span>`;
    html+=`<td class="col-${ci+1}">${cell}</td>`;
  });
  html+='</tr>';
});
html+='</tbody>';
tbl.innerHTML=html;

/* 自适应行高：让表格正好填满一屏 */
function fitTable(){
  const wrap=document.querySelector('.cmp-wrap');
  const avail=wrap.clientHeight;
  const theadH=document.querySelector('#cmpTable thead').offsetHeight;
  const cats=document.querySelectorAll('#cmpTable tbody tr.cat');
  const catH=cats.length?cats[0].offsetHeight:0;
  const rows=document.querySelectorAll('#cmpTable tbody tr.row');
  if(!rows.length) return;
  const dataH=Math.max(9,(avail-theadH-cats.length*catH)/rows.length);
  const fz=dataH<12?8.5:(dataH<14?9:(dataH<16?9.5:10));
  const vpad=dataH<13?0:1;
  rows.forEach(r=>{
    r.style.height=dataH+'px';
    r.querySelectorAll('td').forEach(td=>{td.style.fontSize=fz+'px';td.style.paddingTop=vpad+'px';td.style.paddingBottom=vpad+'px';});
  });
}
window.addEventListener('resize',fitTable);
window.addEventListener('orientationchange',()=>setTimeout(fitTable,100));
setTimeout(fitTable,60);
</script>
</body>
</html>
